name: Livezone Debug Scraper

on:
  workflow_dispatch: # ম্যানুয়ালি রান করানোর জন্য
  schedule:
    - cron: '0 0 * * *' # প্রতিদিন একবার অটো রান করবে

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright
          playwright install chromium

      - name: Run Python Script
        run: python scraper.py

      - name: Commit and push status and HTML files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add status.txt page_source.html
          git commit -m "Update debug status and page source [skip ci]" || exit 0
          git push
