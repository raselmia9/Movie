name: Livezone Movie Scraper

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # ম্যানুয়ালি রান করানোর অপশন
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর অটোমেটিক রান হবে (চাইলে পরিবর্তন করতে পারেন)

jobs:
  scrape-job:
    runs-on: ubuntu-latest

    # গিটহবে ফাইল কমিট করার পার্মিশন দেওয়ার জন্য
    permissions:
      contents: write

    steps:
      # ১. রিপোজিটরি চেকআউট করা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. পাইথন সেটআপ করা
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ৩. ডিপেন্ডেন্সি এবং প্লেরাইট ব্রাউজার ইন্সটল করা
      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      # ৪. আপনার পাইথন স্ক্রিপ্ট রান করা (স্ক্রিপ্ট ফাইলের নাম scraper.py হলে)
      - name: Run Python Scraper
        run: python scraper.py

      # ৫. জেসন ফাইল এবং স্ট্যাটাস ফাইল অটোমেটিক গিটহবে কমিট এবং পুশ করা
      - name: Commit and Push Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-update movies_data.json and status.txt [skip ci]'
          file_pattern: movies_data.json status.txt
          commit_user_name: 'GitHub Action Bot'
          commit_user_email: 'action@github.com'
